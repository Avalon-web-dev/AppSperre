name: APK bauen

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: APK bauen
        run: |
          cd "$(dirname "$(find . -name settings.gradle -not -path './.git/*' | head -n 1)")"
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/AppSperre.apk"

      - name: Als Release bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_number }}" AppSperre.apk --title "AppSperre ${{ github.run_number }}" --notes "Automatisch gebaut"
